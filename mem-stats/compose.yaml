services:
  mem-stats:
    image: ${MEM_STATS_IMAGE_NAME:?MEM_STATS_IMAGE_NAME must be set}
    container_name: ${MEM_STATS_CONTAINER_NAME:?MEM_STATS_CONTAINER_NAME must be set}
    restart: unless-stopped
    ports:
      - "${PORT:?PORT must be set}:8080"
    environment:
      SELF_CONTAINER_NAME: ${MEM_STATS_CONTAINER_NAME:?MEM_STATS_CONTAINER_NAME must be set}
      SAMPLE_INTERVAL: ${SAMPLE_INTERVAL:?SAMPLE_INTERVAL must be set}
      CHECKPOINT_INTERVAL: ${CHECKPOINT_INTERVAL:?CHECKPOINT_INTERVAL must be set}
      BUCKET_SIZE_MIB: ${BUCKET_SIZE_MIB:?BUCKET_SIZE_MIB must be set}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
