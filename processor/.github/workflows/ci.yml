name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: ./verify.sh

      - name: Check Dockerfile
        run: docker build --check .

      - name: Build image
        run: docker build --tag trading-processor:test .

      - name: Smoke-test image imports
        run: docker run --rm --entrypoint python trading-processor:test -c "import main"
