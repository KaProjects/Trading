quarkus.http.port=9090
quarkus.http.cors.origins=http://localhost:3000

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:default;MODE=MariaDB;NON_KEYWORDS=VALUE;INIT=RUNSCRIPT FROM 'sql/createTables.sql'\\;RUNSCRIPT FROM 'classpath:createDevDb.sql'
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.datasource.username=sa
quarkus.datasource.password=

firebase.mode=fake
firebase.data.file=src/dev/resources/firebase.json

finnhub.mode=fake
finnhub.data.file=src/dev/resources/finnhub.json

polygon.mode=fake
polygon.data.file=src/dev/resources/polygon.json
