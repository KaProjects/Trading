quarkus.http.port=9090
quarkus.http.cors.origins=http://localhost:3000

quarkus.datasource.db-kind=h2
# The scripts are run once at startup by DevDatabaseInitializer rather than from the URL: H2
# runs an INIT on every connection, so with a database that outlives its connections the second
# one would drop the tables under the first. DB_CLOSE_DELAY keeps the data for the whole run,
# which is what lets anything written while the app is up - images, records - stay written.
quarkus.datasource.jdbc.url=jdbc:h2:mem:default;DB_CLOSE_DELAY=-1;MODE=MariaDB;NON_KEYWORDS=VALUE
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.datasource.username=sa
quarkus.datasource.password=

firebase.mode=fake
firebase.data.file=src/dev/resources/firebase.json

finnhub.mode=fake
finnhub.data.file=src/dev/resources/finnhub.json

polygon.mode=fake
polygon.data.file=src/dev/resources/polygon.json

alphavantage.mode=fake
alphavantage.data.file=src/dev/resources/alphavantage.json

gemini.mode=fake
gemini.data.file=src/dev/resources/gemini.json

# Draws a few research charts into the dev data at startup.
dev.seed.images=true
