name: TraderTerminal
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  TraderCore:
    path: TraderCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Team signing (Personal Team): the data-protection Keychain needs a stable identity + entitlement (D3.3).
    # DEVELOPMENT_TEAM comes from the encrypted terminal/deploy/signing.xcconfig.
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    # The app runs the service from the uv venv next to it in the repo (D2.7).
    SERVICE_DIR: "$(SRCROOT)/../service"
configFiles:
  Debug: ../../deploy/signing.xcconfig
  Release: ../../deploy/signing.xcconfig
targets:
  TraderTerminal:
    type: application
    platform: macOS
    sources: [TraderTerminal]
    dependencies:
      - package: TraderCore
    info:
      path: TraderTerminal/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        TTServiceDirectory: $(SERVICE_DIR)
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TraderTerminal/TraderTerminal.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_NAME: Trader Terminal Dev
          PRODUCT_BUNDLE_IDENTIFIER: org.kaleta.trader-terminal.dev
        Release:
          PRODUCT_NAME: Trader Terminal
          PRODUCT_BUNDLE_IDENTIFIER: org.kaleta.trader-terminal
