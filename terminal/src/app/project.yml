name: TraderTerminal
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  TraderCore:
    path: TraderCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signing is enough for T2 (Touch ID via LocalAuthentication). Switch to the Personal Team with
    # T3, when Keychain items with biometric access control need a stable signing identity.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    # The app runs the service from the uv venv next to it in the repo (D2.7).
    SERVICE_DIR: "$(SRCROOT)/../service"
targets:
  TraderTerminal:
    type: application
    platform: macOS
    sources: [TraderTerminal]
    dependencies:
      - package: TraderCore
    info:
      path: TraderTerminal/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        TTServiceDirectory: $(SERVICE_DIR)
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          PRODUCT_NAME: Trader Terminal Dev
          PRODUCT_BUNDLE_IDENTIFIER: org.kaleta.trader-terminal.dev
        Release:
          PRODUCT_NAME: Trader Terminal
          PRODUCT_BUNDLE_IDENTIFIER: org.kaleta.trader-terminal
