[project]
name = "trader-service"
version = "0.1.0"
description = "Local trading service for Trader Terminal: broker adapter + API over a Unix socket"
authors = [
    { name = "StanleyKaleta", email = "kstanleykale@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.157.0",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
trader-service = "trader_service.main:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
